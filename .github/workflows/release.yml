name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  issues: write
  pull-requests: write

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.33.2'
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
  PUPPETEER_SKIP_DOWNLOAD: '1'

jobs:
  # Shared setup: populate pnpm store cache (download all packages)
  setup:
    name: Setup & Cache Store
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      cache-key: ${{ steps.cache.outputs.cache-primary-key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies (populate store)
        run: |
          set -e
          for i in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts && break || sleep 5
          done

      - name: Build CLI workspace packages
        run: pnpm --filter @zcode/cli... run build

      - name: Build CLI workspace (zcode.cjs)
        run: pnpm --filter @zcode/cli run build

  # Windows ARM64 (native runner)
  build-win-arm64:
    name: Windows ARM64
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: |
            **/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: |
          set -e
          for i in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts && break || sleep 10
          done
        shell: bash

      - name: Build CLI workspace packages
        run: pnpm --filter @zcode/cli... run build

      - name: Build CLI workspace (zcode.cjs)
        run: pnpm --filter @zcode/cli run build

      - name: Prepare runtime assets (Windows ARM64)
        run: pnpm --filter @zcode/desktop run prepare:runtime-assets
        shell: pwsh

      - name: Build Windows ARM64
        run: pnpm exec electron-builder --config packages/desktop/electron-builder.config.js --win --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-win-arm64
          path: packages/desktop/dist/*.zip
          retention-days: 7

  # Windows x64
  build-win-x64:
    name: Windows x64
    needs: setup
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: |
            **/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: |
          set -e
          for i in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts && break || sleep 10
          done
        shell: bash

      - name: Build CLI workspace packages
        run: pnpm --filter @zcode/cli... run build

      - name: Build CLI workspace (zcode.cjs)
        run: pnpm --filter @zcode/cli run build

      - name: Prepare runtime assets (Windows x64)
        run: pnpm --filter @zcode/desktop run prepare:runtime-assets
        shell: pwsh

      - name: Build Windows x64
        run: pnpm exec electron-builder --config packages/desktop/electron-builder.config.js --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-win-x64
          path: packages/desktop/dist/*.zip
          retention-days: 7

  # macOS (Universal: x64 + ARM64)
  build-macos:
    name: macOS Universal
    needs: setup
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: |
            **/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: |
          set -e
          for i in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts && break || sleep 10
          done
        shell: bash

      - name: Build CLI workspace packages
        run: pnpm --filter @zcode/cli... run build

      - name: Build CLI workspace (zcode.cjs)
        run: pnpm --filter @zcode/cli run build

      - name: Prepare runtime assets (macOS)
        run: pnpm --filter @zcode/desktop run prepare:runtime-assets

      - name: Build macOS Universal (x64 + arm64)
        run: pnpm exec electron-builder --config packages/desktop/electron-builder.config.js --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-macos
          path: packages/desktop/dist/*.{dmg,zip}
          retention-days: 7

  # Linux x64
  build-linux-x64:
    name: Linux x64
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libappindicator3-1 \
            libgbm1 \
            libasound2t64 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgcc1 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libasound2t64 \
            libnss3 \
            lsb-release \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: |
            **/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: |
          set -e
          for i in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts && break || sleep 10
          done
        shell: bash

      - name: Build CLI workspace packages
        run: pnpm --filter @zcode/cli... run build

      - name: Build CLI workspace (zcode.cjs)
        run: pnpm --filter @zcode/cli run build

      - name: Prepare runtime assets (Linux x64)
        run: pnpm --filter @zcode/desktop run prepare:runtime-assets

      - name: Build Linux x64 (AppImage + deb + rpm + pacman)
        run: pnpm exec electron-builder --config packages/desktop/electron-builder.config.js --linux --x64 --publish never

      - name: Upload Linux x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-linux-x64
          path: packages/desktop/dist/*.{AppImage,deb,rpm,pacman}
          retention-days: 7

  # Linux ARM64
  build-linux-arm64:
    name: Linux ARM64
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libappindicator3-1 \
            libgbm1 \
            libasound2t64 \
            libatk1.0-0 \
            libcairo2 \
            libcups2 \
            libdbus-1-3 \
            libexpat1 \
            libfontconfig1 \
            libgcc1 \
            libgdk-pixbuf2.0-0 \
            libglib2.0-0 \
            libgtk-3-0 \
            libnspr4 \
            libnss3 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libstdc++6 \
            libx11-6 \
            libx11-xcb1 \
            libxcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxext6 \
            libxfixes3 \
            libxi6 \
            libxrandr2 \
            libxrender1 \
            libxss1 \
            libxtst6 \
            ca-certificates \
            fonts-liberation \
            libappindicator3-1 \
            libasound2t64 \
            libnss3 \
            lsb-release \
            xdg-utils

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Restore pnpm store
        uses: actions/cache@v4
        with:
          path: |
            **/.pnpm-store
          key: pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-store-

      - name: Install dependencies
        run: |
          set -e
          for i in 1 2 3; do
            pnpm install --frozen-lockfile --ignore-scripts && break || sleep 10
          done
        shell: bash

      - name: Build CLI workspace packages
        run: pnpm --filter @zcode/cli... run build

      - name: Build CLI workspace (zcode.cjs)
        run: pnpm --filter @zcode/cli run build

      - name: Prepare runtime assets (Linux ARM64)
        run: pnpm --filter @zcode/desktop run prepare:runtime-assets

      - name: Build Linux ARM64 (AppImage + deb + rpm + pacman)
        run: pnpm exec electron-builder --config packages/desktop/electron-builder.config.js --linux --arm64 --publish never

      - name: Upload Linux ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-linux-arm64
          path: packages/desktop/dist/*.{AppImage,deb,rpm,pacman}
          retention-days: 7

  # Create GitHub Release with all artifacts
  release:
    name: Create Release
    needs:
      - build-win-arm64
      - build-win-x64
      - build-macos
      - build-linux-x64
      - build-linux-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ZCode ${{ github.ref_name }}
          body_path: packages/desktop/dist/release-notes.txt
          files: |
            artifacts/ZCode-win-arm64/*
            artifacts/ZCode-win-x64/*
            artifacts/ZCode-macos/*
            artifacts/ZCode-linux-x64/*
            artifacts/ZCode-linux-arm64/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}